service: payments-api
replicas: 6
image: registry.example.com/payments-api:1.4.2
port: 8080
env: production
resources:
  cpu: 500m
  memory: 512Mi
  gpu: 0
healthcheck:
  path: /healthz
  interval_seconds: 10
  timeout_seconds: 2
  failure_threshold: 3
logging:
  level: info
  format: json
  retention_days: 7
autoscale:
  enabled: true
  min_replicas: 1
  max_replicas: 5
  target_cpu_percent: 80
database:
  host: db-staging.internal
  port: 5432
  pool_size: 10
  ssl: true
timeouts:
  request_seconds: 30
